name: incidenthub

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    container_name: incidenthub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incidenthub}
      POSTGRES_USER: ${POSTGRES_USER:-incidenthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incidenthub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_v3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incidenthub} -d ${POSTGRES_DB:-incidenthub}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    container_name: incidenthub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: incidenthub-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: incidenthub-minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-incidenthub}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-incidenthub123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  elasticsearch:
    image: ${ELASTIC_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.13.4}
    platform: ${ELASTIC_PLATFORM:-linux/amd64}
    container_name: incidenthub-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elastic_data_v3:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: incidenthub-otel
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: incidenthub-backend
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_ADDR: redis:6379
      ELASTIC_ADDRESSES: http://elasticsearch:9200
      S3_ENABLED: ${S3_ENABLED:-true}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-incidenthub-artifacts}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-incidenthub}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-incidenthub123}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-true}
      ARTIFACTS_MAX_UPLOAD_MB: ${ARTIFACTS_MAX_UPLOAD_MB:-50}
      ARTIFACTS_PRESIGN_TTL: ${ARTIFACTS_PRESIGN_TTL:-15m}
      TRACE_ENABLED: "true"
      TRACE_TENANT: ${TRACE_TENANT:-soc-ir}
      TRACE_SERVICE_KEY: ${TRACE_SERVICE_KEY:-incidenthub}
      HTTP_EXPOSE_SWAGGER: ${HTTP_EXPOSE_SWAGGER:-true}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      AI_ENDPOINT: ${AI_ENDPOINT:-http://host.docker.internal:8001/v1/chat/completions}
      AI_API_KEY: ${AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-llama3.2:3b}
      AI_TIMEOUT: ${AI_TIMEOUT:-60s}
      AI_TOP_K: ${AI_TOP_K:-6}
      AI_MAX_CONTEXT_CHARS: ${AI_MAX_CONTEXT_CHARS:-5000}
      AI_HISTORY_MESSAGES: ${AI_HISTORY_MESSAGES:-20}
      AI_SYSTEM_PROMPT: ${AI_SYSTEM_PROMPT:-You are a SOC assistant specialized in information security incident response. Provide concise, actionable analysis grounded in the provided tenant data.}
      ASYNC_OPS_ENABLED: ${ASYNC_OPS_ENABLED:-false}
      ASYNC_OPS_KAFKA_BROKERS: ${ASYNC_OPS_KAFKA_BROKERS:-kafka:9092}
      ASYNC_OPS_KAFKA_TOPIC: ${ASYNC_OPS_KAFKA_TOPIC:-incidenthub.async.ops}
      ASYNC_OPS_KAFKA_GROUP_ID: ${ASYNC_OPS_KAFKA_GROUP_ID:-incidenthub-api-async-ops}
      ASYNC_OPS_PRODUCE_TIMEOUT: ${ASYNC_OPS_PRODUCE_TIMEOUT:-5s}
      ASYNC_OPS_POLL_TIMEOUT: ${ASYNC_OPS_POLL_TIMEOUT:-1s}
      WORKFLOW_ENGINE: ${WORKFLOW_ENGINE:-internal}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
    expose:
      - "8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_SUPPORT_URL: ${VITE_SUPPORT_URL:-https://support.example.com}
        VITE_UI_SKELETON_MIN_MS: ${VITE_UI_SKELETON_MIN_MS:-300}
    container_name: incidenthub-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  test-data-lab:
    build:
      context: .
      dockerfile: test-data-lab/Dockerfile
      args:
        VITE_TEST_DATA_LAB_DEFAULT_API_BASE_URL: ${VITE_TEST_DATA_LAB_DEFAULT_API_BASE_URL:-}
        VITE_TEST_DATA_LAB_DEFAULT_TENANT_ID: ${VITE_TEST_DATA_LAB_DEFAULT_TENANT_ID:-}
        VITE_TEST_DATA_LAB_DEFAULT_LOGIN_EMAIL: ${BOOTSTRAP_PLATFORM_ADMIN_EMAIL:-admin@incidenthub.local}
        VITE_TEST_DATA_LAB_DEFAULT_LOGIN_PASSWORD: ${BOOTSTRAP_PLATFORM_ADMIN_PASSWORD:-ChangeMeNow123!}
        VITE_TEST_DATA_LAB_DEFAULT_LANGUAGE: ${VITE_TEST_DATA_LAB_DEFAULT_LANGUAGE:-ru}
    container_name: incidenthub-test-data-lab
    depends_on:
      - backend
    ports:
      - "${TEST_DATA_LAB_PORT:-5190}:80"

  docs-web:
    build:
      context: .
      dockerfile: docs-web/Dockerfile
    container_name: incidenthub-docs-web
    ports:
      - "3200:3200"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: incidenthub-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    container_name: incidenthub-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data_v3:
  redis_data:
  kafka_data:
  elastic_data_v3:
  minio_data:
  prometheus_data:
  grafana_data:
